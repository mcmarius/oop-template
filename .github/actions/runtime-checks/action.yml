name: 'Runtime checks'
description: 'Run dynamic analysis tools'

runs:
  using: "composite"
  steps:
    - name: Make scripts executable
      shell: bash
      if: runner.os == 'Linux'
      run: |
        chmod +x scripts/*

    - name: Sanitizers
      shell: bash
      # run one sanitizer for each env to avoid building extra binaries on one env
      # detect_leaks is not supported on macOS
      if: matrix.runs_asan == true && runner.os == 'Linux'
      # might fail for unrelated reasons
      continue-on-error: true
      # env:
      #   ASAN_OPTIONS: detect_leaks=1
      env:
        ASAN_OPTIONS: halt_on_error=0
        EXECUTABLE_NAME: ${{ env.EXECUTABLE_NAME }}
      # working-directory: ${{github.workspace}}
      run: |
        cd "${{ env.ZIP_NAME }}" && \
          xvfb-run ../scripts/run_sanitizers.sh && echo "All tests pass" || true
          # cat "${INPUT_FILENAME}" | tr -d '\r' | ./"${EXECUTABLE_NAME}" && \
          # ./"${TESTS_EXECUTABLE_NAME}" && echo "All tests pass"

    - name: Sanitizers (Windows MSVC)
      shell: bash
      # run one sanitizer for each OS to avoid building extra binaries
      if: matrix.cxx == 'cl' && matrix.runs_asan == true
      # ASAN_OPTIONS: detect_leaks=1
      continue-on-error: true
      env:
        ASAN_OPTIONS: halt_on_error=0
        EXECUTABLE_NAME: ${{ env.EXECUTABLE_NAME }}
      # working-directory: ${{github.workspace}}
      run: |
        # GUI hangs on CI
        # cat "${INPUT_FILENAME}" | ./"${EXECUTABLE_NAME}".exe && \
        cd "${{ env.ZIP_NAME }}" && \
          ./"${TESTS_EXECUTABLE_NAME}".exe && echo "All tests pass"

    - name: Valgrind
      shell: bash
      if: runner.os == 'Linux' && matrix.runs_valgrind == true
      continue-on-error: true
      env:
        EXECUTABLE_NAME: ${{ env.EXECUTABLE_NAME }}
      # working-directory: ${{github.workspace}}
      run: |
        cd "${{ env.ZIP_NAME }}" && xvfb-run ../scripts/run_valgrind.sh . && echo "All tests pass" || true

    - name: Smoke test
      # until we have a proper test env, we cannot fix ASan reliably
      shell: bash
      if: runner.os != 'Windows' && (runner.os == 'macOS' || (matrix.runs_asan != true && matrix.runs_valgrind != true))
      # working-directory: ${{github.workspace}}
      run: |
        # GUI hangs on CI
        # cat "${INPUT_FILENAME}" | tr -d '\r' | ./"${EXECUTABLE_NAME}" && \
        cd "${{ env.ZIP_NAME }}" && \
          ./"${TESTS_EXECUTABLE_NAME}" && echo "All tests pass"

    - name: Smoke test (Windows)
      shell: bash
      if: runner.os == 'Windows' && matrix.runs_asan != true
      # working-directory: ${{github.workspace}}
      run: |
        # GUI hangs on CI
        # cat "${INPUT_FILENAME}" | tr -d '\r' | ./"${EXECUTABLE_NAME}".exe && \
        cd "${{ env.ZIP_NAME }}" && \
          ./"${TESTS_EXECUTABLE_NAME}".exe && echo "All tests pass"
