name: 'Runtime checks'
description: 'Run dynamic analysis tools'

runs:
  using: "composite"
  steps:
    - name: Sanitizers
      shell: bash
      # run one sanitizer for each env to avoid building extra binaries on one env
      if: matrix.runs_asan == true && runner.os != 'Windows'
      # detect_leaks is not supported on macOS
      # env:
      #   ASAN_OPTIONS: detect_leaks=1
      run: |
        cd "${{ env.ZIP_NAME }}" && \
          cat "${INPUT_FILENAME}" | tr -d '\r' | ./"${EXECUTABLE_NAME}" && \
          cat "${INPUT_FILENAME}" | tr -d '\r' | ./"${TESTS_EXECUTABLE_NAME}"

    - name: Sanitizers (Windows MSVC)
      shell: bash
      # run one sanitizer for each OS to avoid building extra binaries
      if: matrix.cxx == 'cl' && matrix.runs_asan == true
      continue-on-error: true
      run: |
        cd "${{ env.ZIP_NAME }}" && \
          cat "${INPUT_FILENAME}" | ./"${EXECUTABLE_NAME}".exe && \
          cat "${INPUT_FILENAME}" | ./"${TESTS_EXECUTABLE_NAME}".exe

    # Check this claim: The ASan rows need no equivalent list: their `Run tests` step already runs the
    # sanitizer-instrumented test binary built by the same job.
    - name: Valgrind
      shell: bash
      if: runner.os == 'Linux' && matrix.runs_valgrind == true
      run: |
        cd "${{ env.ZIP_NAME }}" && bash ../scripts/run_valgrind.sh .
